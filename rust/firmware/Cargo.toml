[package]
name = "stackchan-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stackchan-avatar-face = { path = "../avatar-face" }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "=0.53.0"
log = "0.4"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }

[build-dependencies]
embuild = { version = "0.33.5", features = ["espidf"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"

[package.metadata.esp-idf-sys]
mcu = "esp32s3"
esp_idf_version = "v5.4.2"
esp_idf_tools_install_dir = "workspace"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults", "sdkconfig.partition.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.2" }
